/* ===== BACKEND: callBackend + actionId ===== */
// payload = array argumen fungsi backend, mis. callBackend('api_saveTransaction',[actionId, tx])
async function callBackend(action,payload=[]){
 const session=getSess();
 if(hasGas()) // dibuka dari web app GAS: satu pintu publik "gateway" (sesi tetap divalidasi server)
  return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error((e&&e.message)||e))).gateway(action,payload,session));
 if(!API_URL)throw new Error('API_URL belum diisi');
 const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,args:payload,session})});
 if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function call(action,payload){const r=await callBackend(action,payload);
 if(!r||!r.ok){const m=(r&&r.error)||'Permintaan gagal';if(r&&r.status===401&&!$('#au'))logout(false,'Sesi berakhir. Silakan masuk lagi.');throw new Error(m)}return r}

function pd(t,s){ // patch dashboard lokal (optimistic) — nanti ditimpa data server
 const D=S.D;if(!D||!t||!t.Date)return;const a=(Number(t.Approx_IDR)||0)*s,c=D.cards.find(x=>x.id==t.Card_ID);
 if(c&&t.Date>=c.cycleStart){c.used+=a;c.cycleSpend+=a;c.pct=c.limit?Math.round(c.used/c.limit*100):0}
 D.limit.used=D.cards.filter(x=>x.status=='Aktif').reduce((u,x)=>u+x.used,0);D.limit.pct=D.limit.total?Math.round(D.limit.used/D.limit.total*100):0;
 if(isR(t)){if(isPend(t)){D.reimburse.pendingTotal+=a;D.reimburse.pendingCount+=s}return}
 if(t.Date.slice(0,7)!=D.today.slice(0,7))return;
 const d=+t.Date.slice(8);D.netSpendingMonth+=a;D.daily.current=D.daily.current.map((v,i)=>v!=null&&i>=d-1?v+a:v);
 D.deltaPct=D.sameDateLastMonth?Math.round((D.netSpendingMonth-D.sameDateLastMonth)/D.sameDateLastMonth*100):null;
 let k=D.categories.find(x=>x.id==t.Category_ID);if(!k){k={id:t.Category_ID,name:kn(t.Category_ID),current:0,previous:0,pct:null};D.categories.push(k)}
 k.current+=a;k.pct=k.previous?Math.round((k.current-k.previous)/k.previous*100):null;D.categories.sort((x,y)=>y.current-x.current)}

/* ===== REKONSILIASI E-STATEMENT (AI + split view) ===== */
const MON={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,aug:8,ags:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
const DRE=/^(\d{1,2})[\/\-. ]([A-Za-z]{3,9}|\d{1,2})(?:[\/\-. ](\d{4}|\d{2}))?(?=\s)/,ARE=/(-?\(?\d[\d.,]*)\)?\s*(CR\.?|DB\.?|DR\.?)?\s*$/i;
function pDate(d,m,y){m=isNaN(m)?MON[String(m).slice(0,3).toLowerCase()]:+m;if(!m||m>12||+d>31||+d<1)return null;const N=new Date();let yy=y?(+y<100?2000+ +y:+y):N.getFullYear(),s=yy+'-'+p2(m)+'-'+p2(d);if(!y&&s>F(new Date(N.getTime()+7*864e5)))s=(yy-1)+s.slice(4);return s}
function pAmt(s){s=String(s).replace(/[^\d.,]/g,'');const d=s.lastIndexOf('.'),c=s.lastIndexOf(','),i=Math.max(d,c);let dec=-1;if(d>=0&&c>=0)dec=i;else if(i>=0&&s.split(s[i]).length==2&&s.length-i-1!=3)dec=i;
 return parseFloat((dec>=0?s.slice(0,dec):s).replace(/[.,]/g,'')+(dec>=0?'.'+s.slice(dec+1):''))||0}
function pLine(l){let r=l.trim();const d=[];for(let i=0;i<2;i++){const m=r.match(DRE);if(!m)break;const x=pDate(m[1],m[2],m[3]);if(!x)break;d.push(x);r=r.slice(m[0].length).trim()}
 if(!d.length)return null;const am=r.match(ARE);if(!am)return null;const a=pAmt(am[1]);if(!(a>0))return null;const m=r.slice(0,am.index).replace(/\s+/g,' ').trim();if(!m)return null;
 return{dt:d[0],bk:d[1]||d[0],m,a,cr:/^CR/i.test(am[2]||'')||/^-/.test(am[1])}}
const kind=m=>/annual fee|iuran tahunan/i.test(m)?'Iuran Tahunan':/cicilan|installment|ccl\d+|\b\d{1,3}\s*\/\s*\d{1,3}\b|ke\s*\d+\s*dari\s*\d+/i.test(m)?'Cicilan':'Belanja';
const instOf=m=>{const x=m.match(/(\d{1,3})\s*\/\s*(\d{1,3})/)||m.match(/ke\s*(\d+)\s*dari\s*(\d+)/i);return x?[+x[1],+x[2]]:['','']};
const mkRow=x=>{const[a,b]=instOf(x.m),t=kind(x.m);return{id:++uid,dt:x.dt,bk:x.bk,m:x.m,a:x.a,k:detect(x.m),t,ic:t=='Cicilan'?a:'',it:t=='Cicilan'?b:'',pg:0}};
const fmtN=n=>Number(n||0).toLocaleString('id-ID');
const maskPan=t=>String(t).replace(/\b(?:\d[ -]?){12,15}(\d{4})\b/g,'**** **** **** $1'); // nomor kartu 16 digit disamarkan sebelum dikirim ke AI
const stp=n=>`<div class="flex gap-2 text-xs mb-2 mu flex-wrap">${['Upload','Verifikasi','Hasil'].map((t,i)=>`<span style="${i<=n?'color:var(--pr);font-weight:700':''}">${i+1}. ${t}</span>`).join(' → ')}</div>`;
function rst(){try{R&&R.o&&R.o.doc&&R.o.doc.destroy();R&&R.o&&R.o.url&&URL.revokeObjectURL(R.o.url)}catch(e){}R=null;render()}
async function readDoc(f,pw){
 const n=f.name.toLowerCase(),o={kind:'',lines:[],text:'',doc:null,url:null};
 if(n.endsWith('.pdf')||f.type=='application/pdf'){
  if(!window.pdfjsLib)throw new Error('Library PDF belum termuat');
  const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer(),password:pw||undefined}).promise;o.kind='pdf';o.doc=doc;
  for(let p=1;p<=doc.numPages;p++){const c=await(await doc.getPage(p)).getTextContent(),m={};c.items.forEach(i=>{const y=Math.round(i.transform[5]/3);(m[y]=m[y]||[]).push(i)});
   const L=Object.keys(m).map(Number).sort((a,b)=>b-a).map(y=>m[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean);
   o.lines.push(...L);o.text+='\n=== HALAMAN '+p+' ===\n'+L.join('\n')}
  return o}
 if(/\.(xlsx|xls|csv)$/.test(n)){const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}),L=[];
  wb.SheetNames.forEach(s=>XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,raw:true,defval:''}).forEach(r=>L.push(r.map(c=>c instanceof Date?p2(c.getDate())+'/'+p2(c.getMonth()+1)+'/'+c.getFullYear():String(c)).join(' ').trim())));
  o.kind='sheet';o.lines=L;o.text=L.join('\n');return o}
 if((f.type||'').startsWith('image/')||/\.(png|jpe?g|webp)$/.test(n)){o.kind='img';o.url=URL.createObjectURL(f);return o}
 throw new Error('Format tidak didukung (PDF, gambar, Excel, CSV)')}
async function aiRead(o,f,hadPw){ // teks dikirim bila ada; PDF scan / gambar dikirim sebagai berkas
 const p={};
 if(o.kind=='sheet'||(o.kind=='pdf'&&o.text.replace(/\s/g,'').length>=200))p.text=maskPan(o.text);
 else{if(hadPw)throw new Error('PDF terproteksi tanpa lapisan teks tidak bisa dikirim ke AI.');const b=await fileB64(f);if(b.b64.length>14e6)throw new Error('File terlalu besar untuk AI (maks ±10 MB).');p.file={mime:b.mime,base64:b.b64}}

  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.done){e.target.dataset.done=1;drawPage(o.doc,e.target,el)}}),{root:el,rootMargin:'500px'});

 c.width=vp.width;c.height=vp.height;c.style.cssText='width:100%;display:block';d.style.aspectRatio=v0.width+'/'+v0.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;d.appendChild(c)}catch(e){}}

  <label class="op"><input type="radio" name="o" value="new" onchange="$('#f_oa').disabled=true;$('#f_ob').disabled=false"> <b>Buat ${w} baru</b> untuk menampung data<input id="f_ob" class="inp mt-2" placeholder="Nama ${w} baru" disabled></label>${btns(`ddo('${t}','${id}')`,'Pindahkan & Hapus')}`)}}
async function ddo(t,id){const card=t=='c',mode=document.querySelector('input[name=o]:checked').value,it=(card?S.cards:S.cats).find(x=>x.ID==id),opt={mode};
 if(mode=='move')opt.targetId=$('#f_oa').value;else{const nm=$('#f_ob').value.trim();if(!nm)return toast('Isi nama baru');opt[card?'newCard':'newCategory']=card?{Name:nm,Last4:it.Last4,Credit_Limit:it.Credit_Limit,Statement_Date:it.Statement_Date,Due_Date:it.Due_Date,Annual_Fee:0,Status:'Aktif'}:{Name:nm,Keyword_Patterns:[]}}
 cm();toast('Memproses…');try{await call(card?'api_deleteCard':'api_deleteCategory',[uuid(),id,opt]);toast('Data dipindahkan, '+(card?'kartu':'kategori')+' dihapus');await reload()}catch(e){toast(e.message)}}

document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i,+e.dataset.s||20));
boot();
